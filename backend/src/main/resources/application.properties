spring.application.name=backend

# Secrets come from backend/.env (not in git) or from environment variables on the server
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Tables are created only by Flyway migrations; Hibernate just checks they match
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# JWT login: secret comes from backend/.env (JWT_SECRET, at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480

# Send our error messages (e.g. "Wrong username or password.") to the frontend
server.error.include-message=always
